services:
  jeux-scores:
    # Construit l'image à partir du Dockerfile de ce dossier.
    # Aucun chemin à configurer : décompressez le dossier n'importe où
    # sur le NAS, puis créez le projet dans Container Manager.
    build: .
    image: jeux-scores:latest
    container_name: jeux-scores
    restart: unless-stopped
    ports:
      # Accès via http://IP-DU-NAS:8088  (changez 8088 à gauche si le port est pris)
      - "8088:80"
