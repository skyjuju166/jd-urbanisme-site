name: Deploy to o2switch
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy site files via FTP
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get install -y lftp curl jq
          mkdir -p site
          curl -s "https://api.github.com/repos/skyjuju166/jd-urbanisme-site/contents/site" \
            | jq -r '.[] | select(.type=="file") | .download_url' \
            | while read url; do
                fname=$(basename "$url")
                curl -sL "$url" -o "site/$fname"
                echo "Downloaded: $fname"
              done
          lftp -c "set ftp:ssl-allow no; open -u wujo2132,$FTP_PASSWORD ftp.wujo2132.odns.fr; mirror -R --verbose site/ /public_html/"
